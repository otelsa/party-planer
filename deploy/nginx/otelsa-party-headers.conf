# Kopfzeilen der Partyseite (kein Token, kein Geheimnis - liegt im Git).
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Kein Indexieren, kein Zwischenspeichern, kein Textauszug, kein KI-Training.
# Hinweis: /e/ steht bewusst NICHT in der robots.txt - die ist oeffentlich lesbar
# und wuerde den Pfad verraten. Dort gilt global "Disallow: /".
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" always;
add_header X-Robots-Tag "noai, noimageai" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cache-Control "no-store" always;
