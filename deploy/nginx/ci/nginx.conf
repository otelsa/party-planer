# nginx-Konfiguration nur fuer die CI: bildet den Produktionsaufbau ohne TLS nach.
user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;

    # wie in Produktion
    limit_req_zone  $binary_remote_addr zone=otelsa_req:1m rate=10r/s;
    limit_req_status 429;

    include /etc/nginx/snippets/otelsa-party-log.conf;
    access_log /var/log/nginx/access.log combined_masked;

    server {
        listen 8080 default_server;
        server_name otelsa.de;

        # Produktionsverhalten des Landingpage-Servers
        limit_req zone=otelsa_req burst=20 nodelay;

        include /etc/nginx/snippets/otelsa-party.conf;

        # Der Methodenschutz steht wie in Produktion in den Landingpage-Locations,
        # nicht auf Serverebene - sonst koennte die Partyseite keine Formulare annehmen.
        location = / {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            return 200 "landing page stand-in\n";
        }
        location / { return 404; }
    }
}
