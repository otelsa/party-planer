# Gehoert in den http-Block (auf dem Server: /etc/nginx/nginx.conf).
#
# 1. Das Hauptlog maskiert /e/-Pfade, damit kein Token darin landet - auch nicht bei
#    Antworten, die auf Serverebene entstehen (z. B. 405 bei POST).
map $request $request_masked {
    "~^(?<meth>\S+) /e/\S+ (?<prot>\S+)$"  "$meth /e/<token> $prot";
    default                                "$request";
}
log_format combined_masked '$remote_addr - $remote_user [$time_local] "$request_masked" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# 2. Eigenes Log der Partyseite, ebenfalls ohne Token.
log_format party '$remote_addr - [$time_local] "$request_method /e/<token> $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent"';
